<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" role="img" aria-labelledby="t d">
  <title id="t">A message and a question</title>
  <desc id="d">A message goes from one sender to every listener and nothing comes back. A question goes from an asker to one answerer, and the answer comes back.</desc>
  <defs>
    <marker id="end" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffc933"/></marker>
  </defs>
  <rect width="880" height="370" rx="18" fill="#1b2431"/>

  <!-- a message -->
  <rect x="24" y="24" width="404" height="322" rx="14" fill="#232e3f"/>
  <text x="48" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f7f4ec">A message</text>
  <text x="48" y="88" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#ffc933">send → on</text>
  <g fill="#1b2431" stroke="#46546a" stroke-width="1.5">
    <rect x="56" y="176" width="112" height="52" rx="10"/>
    <rect x="290" y="116" width="112" height="44" rx="10"/>
    <rect x="290" y="180" width="112" height="44" rx="10"/>
    <rect x="290" y="244" width="112" height="44" rx="10"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#f7f4ec" text-anchor="middle">
    <text x="112" y="207">sender</text>
    <text x="346" y="143">listener</text>
    <text x="346" y="207">listener</text>
    <text x="346" y="271">listener</text>
  </g>
  <g stroke="#ffc933" stroke-width="2.5" fill="none">
    <path d="M172 202 L283 141" marker-end="url(#end)"/>
    <path d="M172 202 H283" marker-end="url(#end)"/>
    <path d="M172 202 L283 263" marker-end="url(#end)"/>
  </g>
  <text x="48" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#aab4c3">Everyone listening hears it. Nothing comes back.</text>

  <!-- a question -->
  <rect x="452" y="24" width="404" height="322" rx="14" fill="#232e3f"/>
  <text x="476" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f7f4ec">A question</text>
  <text x="476" y="88" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#ffc933">ask → answer</text>
  <g fill="#1b2431" stroke="#46546a" stroke-width="1.5">
    <rect x="484" y="176" width="112" height="52" rx="10"/>
    <rect x="712" y="176" width="112" height="52" rx="10"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#f7f4ec" text-anchor="middle">
    <text x="540" y="207">asker</text>
    <text x="768" y="207">answerer</text>
  </g>
  <g stroke="#ffc933" stroke-width="2.5" fill="none">
    <path d="M601 190 H703" marker-end="url(#end)"/>
    <path d="M707 214 H605" marker-end="url(#end)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#aab4c3" text-anchor="middle">
    <text x="654" y="162">{ a: 20, b: 22 }</text>
    <text x="654" y="248">42</text>
  </g>
  <text x="476" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#aab4c3">One port answers. The asker awaits the result.</text>
</svg>
