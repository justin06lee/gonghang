<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-labelledby="t d">
  <title id="t">The idea in one picture</title>
  <desc id="d">Two components each hold a port. An adapter carries what the ports say across the boundary between them. Both sides import the same contract type.</desc>
  <defs>
    <marker id="end" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffc933"/></marker>
    <marker id="start" viewBox="0 0 10 10" refX="3" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#ffc933"/></marker>
  </defs>
  <rect width="880" height="410" rx="18" fill="#1b2431"/>

  <!-- the contract, shared by both sides -->
  <rect x="310" y="28" width="260" height="80" rx="12" fill="#ffc933"/>
  <text x="440" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1b2431">the contract</text>
  <text x="440" y="88" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#1b2431">type App = { … }</text>
  <g stroke="#ffc933" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round" fill="none">
    <path d="M350 114 L268 234"/>
    <path d="M530 114 L612 234"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#aab4c3">
    <text x="296" y="166" text-anchor="end">imports it</text>
    <text x="584" y="166">imports it</text>
    <text x="440" y="174" text-anchor="middle">a boundary</text>
    <text x="440" y="336" text-anchor="middle">thread · process · network</text>
  </g>

  <!-- the boundary between the two components -->
  <path d="M440 184 V304 M440 346 V392" stroke="#6c7a8e" stroke-width="1.5" stroke-dasharray="6 6" fill="none"/>

  <!-- component A -->
  <rect x="30" y="190" width="300" height="190" rx="14" fill="#232e3f" stroke="#3a4658" stroke-width="1.5"/>
  <text x="52" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f7f4ec">Component A</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14.5" fill="#aab4c3">
    <text x="52" y="272">port.send(…)</text>
    <text x="52" y="300">port.ask(…)</text>
  </g>
  <path d="M172 281 H208" stroke="#6c7a8e" stroke-width="2"/>
  <rect x="215" y="240" width="100" height="82" rx="10" fill="#1b2431" stroke="#ffc933" stroke-width="2.5"/>
  <text x="265" y="287" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#f7f4ec">port</text>

  <!-- component B -->
  <rect x="550" y="190" width="300" height="190" rx="14" fill="#232e3f" stroke="#3a4658" stroke-width="1.5"/>
  <text x="698" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f7f4ec">Component B</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14.5" fill="#aab4c3">
    <text x="698" y="272">port.on(…)</text>
    <text x="698" y="300">port.answer(…)</text>
  </g>
  <path d="M672 281 H690" stroke="#6c7a8e" stroke-width="2"/>
  <rect x="565" y="240" width="100" height="82" rx="10" fill="#1b2431" stroke="#ffc933" stroke-width="2.5"/>
  <text x="615" y="287" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#f7f4ec">port</text>

  <!-- the adapter, carrying frames both ways -->
  <path d="M324 281 H556" stroke="#ffc933" stroke-width="3" fill="none" marker-start="url(#start)" marker-end="url(#end)"/>
  <rect x="388" y="262" width="104" height="38" rx="19" fill="#1b2431" stroke="#ffc933" stroke-width="2"/>
  <text x="440" y="286" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#ffc933">adapter</text>
</svg>
