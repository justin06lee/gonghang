<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d">
  <title id="t">What happens when you ask</title>
  <desc id="d">Five steps. The asker's port makes an ask frame and starts a timer. The frame crosses the adapter. The answerer's port runs its handler. An answer frame crosses back. The asker's port matches it to the waiting ask and the promise resolves.</desc>
  <defs>
    <marker id="end" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffc933"/></marker>
  </defs>
  <rect width="880" height="470" rx="18" fill="#1b2431"/>

  <!-- who is involved -->
  <g stroke="#46546a" stroke-width="1.5" stroke-dasharray="4 6" fill="none">
    <path d="M160 68 V452"/>
    <path d="M440 68 V452"/>
    <path d="M720 68 V452"/>
  </g>
  <g fill="#1b2431" stroke="#ffc933" stroke-width="2">
    <rect x="60" y="26" width="200" height="42" rx="10"/>
    <rect x="370" y="26" width="140" height="42" rx="21"/>
    <rect x="620" y="26" width="200" height="42" rx="10"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">
    <text x="160" y="52" fill="#f7f4ec">asker's port</text>
    <text x="440" y="52" fill="#ffc933">adapter</text>
    <text x="720" y="52" fill="#f7f4ec">answerer's port</text>
  </g>

  <!-- the two frames that travel -->
  <g stroke="#ffc933" stroke-width="2.5" fill="none">
    <path d="M164 192 H712" marker-end="url(#end)"/>
    <path d="M716 338 H168" marker-end="url(#end)"/>
  </g>
  <g fill="#1b2431" stroke="#46546a" stroke-width="1.5">
    <rect x="262" y="170" width="356" height="44" rx="8"/>
    <rect x="262" y="316" width="356" height="44" rx="8"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#f7f4ec" text-anchor="middle">
    <text x="440" y="196">{ kind: "ask", id: "a#2", name: "sum", … }</text>
    <text x="440" y="342">{ kind: "answer", to: "a#2", data: 42, … }</text>
  </g>

  <!-- what each port does -->
  <g fill="#2b3749" stroke="#46546a" stroke-width="1.5">
    <rect x="30" y="92" width="260" height="58" rx="10"/>
    <rect x="590" y="238" width="260" height="58" rx="10"/>
    <rect x="30" y="384" width="260" height="58" rx="10"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#f7f4ec" text-anchor="middle">
    <text x="160" y="116">ask("sum", { a: 20, b: 22 })</text>
    <text x="720" y="262">answer("sum", handler)</text>
    <text x="160" y="408">ask(…) resolves with 42</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#aab4c3" text-anchor="middle">
    <text x="160" y="137">makes a frame, starts a timer</text>
    <text x="720" y="283">the handler runs and returns 42</text>
    <text x="160" y="429">matched by "to", the id of the ask</text>
  </g>

  <!-- step numbers -->
  <g fill="#ffc933">
    <circle cx="30" cy="92" r="12"/>
    <circle cx="262" cy="170" r="12"/>
    <circle cx="590" cy="238" r="12"/>
    <circle cx="262" cy="316" r="12"/>
    <circle cx="30" cy="384" r="12"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1b2431" text-anchor="middle">
    <text x="30" y="96.5">1</text>
    <text x="262" y="174.5">2</text>
    <text x="590" y="242.5">3</text>
    <text x="262" y="320.5">4</text>
    <text x="30" y="388.5">5</text>
  </g>
</svg>
