name: ci

on:
  push:
    branches: [master]
  pull_request:

# The job only reads the repo, so that is all its token may do.
permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: denoland/setup-deno@v2
      # The same golden path as a fresh clone: install, typecheck, test, build,
      # then run the built file on bun, node and deno.
      - run: make
